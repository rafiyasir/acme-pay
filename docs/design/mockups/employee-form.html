<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit employee</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4F36B}a:hover{color:#E6FA9E}
</style>
</helmet>
<div style="width: 900px; height: 1040px; box-sizing: border-box; padding: 28px; background: linear-gradient(115deg, #E9ECEA 0%, #EEF1EE 42%, #E8F5DD 78%, #DCF3C8 100%); font-family: 'Outfit', system-ui, sans-serif; color: #2B2B2B; font-size: 14.5px; display: flex; gap: 20px">

<div aria-hidden="true" style="flex: 1; border-radius: 32px; background: #F6F8F5; padding: 18px; display: flex; flex-direction: column; gap: 10px; opacity: 0.55">
<div style="height: 44px; border-radius: 999px; background: #FFFFFF"></div>
<div style="flex: 1; border-radius: 26px; background: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="height: 14px; width: 70%; border-radius: 999px; background: #E9EDEA"></div>
<div style="height: 40px; border-radius: 14px; background: #F0F8DF"></div>
<div style="height: 40px; border-radius: 14px; background: #F4F6F4"></div>
<div style="height: 40px; border-radius: 14px; background: #F4F6F4"></div>
<div style="height: 40px; border-radius: 14px; background: #F4F6F4"></div>
<div style="height: 40px; border-radius: 14px; background: #F4F6F4"></div>
</div>
</div>

<form aria-labelledby="form-h" style="flex: 0 0 460px; box-sizing: border-box; border-radius: 28px; background: #2B2B2B; color: #F3F5F3; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="form-h" style="margin: 0; font-size: 22px; font-weight: 400">Edit employee</h2>
<p style="margin: 0; color: #AEB4B0; font-size: 13.5px">EMP-00412 · fields marked * are required</p>
</div>
<button type="button" aria-label="Close form" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #F3F5F3; font: inherit; font-size: 18px">×</button>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-name" style="font-size: 13px; color: #AEB4B0">Full name *</label>
<input id="f-name" value="Aarav Mehta" style="min-height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #F3F5F3; font: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-email" style="font-size: 13px; color: #AEB4B0">Work email *</label>
<input id="f-email" type="email" value="aarav.mehta@acme.co" style="min-height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #F3F5F3; font: inherit">
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-title" style="font-size: 13px; color: #AEB4B0">Job title *</label>
<select id="f-title" style="min-height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: #383838; color: #F3F5F3; font: inherit"><option>Software Engineer</option><option>Senior Software Engineer</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-dept" style="font-size: 13px; color: #AEB4B0">Department *</label>
<select id="f-dept" style="min-height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: #383838; color: #F3F5F3; font: inherit"><option>Engineering</option><option>Product</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-country" style="font-size: 13px; color: #AEB4B0">Country *</label>
<select id="f-country" style="min-height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: #383838; color: #F3F5F3; font: inherit"><option>India</option><option>United States</option><option>United Kingdom</option><option>Germany</option><option>Canada</option><option>Singapore</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-hire" style="font-size: 13px; color: #AEB4B0">Hire date *</label>
<input id="f-hire" type="date" value="2021-03-15" style="min-height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #F3F5F3; font: inherit; color-scheme: dark">
</div>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
<legend style="padding: 0; margin-bottom: 6px; font-size: 13px; color: #AEB4B0">Employment type *</legend>
<div style="display: flex; gap: 6px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.06)">
<label style="flex: 1; min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #D4F36B; color: #2B2B2B; font-weight: 500"><input type="radio" name="et" checked style="position: absolute; opacity: 0">Full-time</label>
<label style="flex: 1; min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #F3F5F3"><input type="radio" name="et" style="position: absolute; opacity: 0">Part-time</label>
<label style="flex: 1; min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #F3F5F3"><input type="radio" name="et" style="position: absolute; opacity: 0">Contractor</label>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-salary" style="font-size: 13px; color: #AEB4B0">Gross annual salary *</label>
<div style="display: flex; min-height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); overflow: hidden">
<span style="display: flex; align-items: center; gap: 6px; padding: 0 14px; border-right: 1px solid rgba(255,255,255,0.12); color: #AEB4B0; font-size: 13.5px">
<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>INR</span>
<input id="f-salary" inputmode="numeric" value="18,40,000" aria-describedby="f-salary-help" style="flex: 1; min-width: 0; border: 0; padding: 0 14px; background: transparent; color: #F3F5F3; font: inherit; font-size: 18px; font-variant-numeric: tabular-nums">
</div>
<p id="f-salary-help" style="margin: 0; font-size: 12.5px; color: #AEB4B0">Currency follows the country. Changing country asks for a new salary; amounts are never converted.</p>
</div>

<div style="border-radius: 18px; background: rgba(212,243,107,0.1); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-variant-numeric: tabular-nums">
<p style="margin: 0; font-size: 12.5px; color: #AEB4B0">Preview after saving</p>
<div style="display: flex; justify-content: space-between"><span style="color: #AEB4B0">TDS (10%)</span><span>− 1,84,000</span></div>
<div style="display: flex; justify-content: space-between"><span>Net annual</span><span style="color: #D4F36B; font-size: 17px">INR 16,56,000</span></div>
<div style="display: flex; justify-content: space-between"><span style="color: #AEB4B0">vs median (Software Engineer, India)</span><span style="color: #D4F36B">+8%</span></div>
</div>

<div style="margin-top: auto; display: flex; gap: 10px">
<button type="button" style="min-height: 52px; padding: 0 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22); background: transparent; color: #F3F5F3; font: inherit">Cancel</button>
<button type="submit" style="flex: 1; min-height: 52px; border-radius: 999px; border: 0; background: #D4F36B; color: #2B2B2B; font: inherit; font-weight: 500">Save changes</button>
</div>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
