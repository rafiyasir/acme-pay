<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit employee on mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4F36B}a:hover{color:#E6FA9E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(160deg, #EEF1EE 0%, #E8F5DD 60%, #DCF3C8 100%); font-family: 'Outfit', system-ui, sans-serif; color: #2B2B2B; font-size: 14.5px">
<div aria-hidden="true" style="padding: 22px 18px; display: flex; flex-direction: column; gap: 10px">
<div style="height: 40px; width: 140px; border-radius: 999px; border: 1.5px solid #9DA39F"></div>
<div style="height: 34px; width: 160px; border-radius: 10px; background: rgba(43,43,43,0.12); margin-top: 8px"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(43,43,43,0.35)"></div>

<form aria-labelledby="mf-h" style="position: absolute; left: 0; right: 0; bottom: 0; top: 56px; box-sizing: border-box; border-radius: 30px 30px 0 0; background: #2B2B2B; color: #F3F5F3; padding: 10px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25); margin: 0 auto"></div>
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 id="mf-h" style="margin: 0; font-size: 21px; font-weight: 400">Edit employee</h2>
<button type="button" aria-label="Close form" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #F3F5F3; font: inherit; font-size: 18px">×</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-name" style="font-size: 13px; color: #AEB4B0">Full name *</label><input id="m-name" value="Aarav Mehta" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #F3F5F3; font: inherit"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-email" style="font-size: 13px; color: #AEB4B0">Work email *</label><input id="m-email" type="email" value="aarav.mehta@acme.co" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #F3F5F3; font: inherit"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-title" style="font-size: 13px; color: #AEB4B0">Job title *</label><select id="m-title" style="min-height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: #383838; color: #F3F5F3; font: inherit"><option>Software Engineer</option></select></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-country" style="font-size: 13px; color: #AEB4B0">Country *</label><select id="m-country" style="min-height: 48px; padding: 0 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: #383838; color: #F3F5F3; font: inherit"><option>India</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="m-dept" style="font-size: 13px; color: #AEB4B0">Department *</label><select id="m-dept" style="min-height: 48px; padding: 0 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: #383838; color: #F3F5F3; font: inherit"><option>Engineering</option></select></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="m-salary" style="font-size: 13px; color: #AEB4B0">Gross annual salary *</label>
<div style="display: flex; min-height: 50px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); overflow: hidden">
<span style="display: flex; align-items: center; padding: 0 12px; border-right: 1px solid rgba(255,255,255,0.12); color: #AEB4B0; font-size: 13.5px">INR</span>
<input id="m-salary" inputmode="numeric" value="18,40,000" style="flex: 1; min-width: 0; border: 0; padding: 0 12px; background: transparent; color: #F3F5F3; font: inherit; font-size: 17px">
</div>
</div>
<p style="margin: 0; font-size: 12.5px; color: #AEB4B0">Employment type and hire date are further down.</p>
<div style="margin-top: auto; position: sticky; bottom: 0; display: flex; gap: 10px; padding: 14px 0 22px; background: #2B2B2B; border-top: 1px solid rgba(255,255,255,0.08)">
<button type="button" style="min-height: 52px; padding: 0 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22); background: transparent; color: #F3F5F3; font: inherit">Cancel</button>
<button type="submit" style="flex: 1; min-height: 52px; border-radius: 999px; border: 0; background: #D4F36B; color: #2B2B2B; font: inherit; font-weight: 500">Save changes</button>
</div>
</form>
</div>
</x-dc>

</body>
</html>
