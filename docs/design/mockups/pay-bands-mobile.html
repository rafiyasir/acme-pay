<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pay bands on mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B2B2B}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: linear-gradient(160deg, #EEF1EE 0%, #E8F5DD 60%, #DCF3C8 100%); font-family: 'Outfit', system-ui, sans-serif; color: #2B2B2B; font-size: 14.5px; font-variant-numeric: tabular-nums; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 8px">
<span style="display: flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #9DA39F; font-size: 19px; font-weight: 300">acme pay</span>
<button type="button" aria-label="Menu" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.75); font: inherit; font-size: 18px">≡</button>
</header>
<div style="padding: 6px 18px 12px; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 38px; font-weight: 300; letter-spacing: -0.02em">Pay bands</h1>
<p style="margin: 0; color: #3F4440; font-size: 13.5px">Gross annual · median and middle 50%</p>
</div>
<div role="tablist" aria-label="Country" style="display: flex; gap: 6px; padding: 0 18px 14px; overflow: hidden; white-space: nowrap">
<button type="button" role="tab" aria-selected="true" style="min-height: 42px; padding: 0 16px; border-radius: 999px; border: 0; background: #2B2B2B; color: #FFFFFF; font: inherit">India · INR</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 42px; padding: 0 16px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.75); font: inherit; color: #2B2B2B">US · USD</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 42px; padding: 0 16px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.75); font: inherit; color: #2B2B2B">UK · GBP</button>
</div>

<ul role="list" style="flex: 1; margin: 0 10px 10px; padding: 8px; list-style: none; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
<li>
<a href="Insights.dc.html" style="{{ r.style }}">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="font-weight: 500">{{ r.title }}</span>
<span style="font-size: 17px">{{ r.median }}</span>
</span>
<span aria-hidden="true" style="position: relative; display: block; height: 8px; border-radius: 999px; background: #E9EDEA">
<span style="{{ r.box }}"></span>
<span style="{{ r.tick }}"></span>
</span>
<span style="display: flex; justify-content: space-between; font-size: 12.5px; color: #6F7571">
<span>{{ r.people }} people</span>
<span style="{{ r.outStyle }}">{{ r.outText }}</span>
</span>
</a>
</li>
</sc-for>
</ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 1700000, total = 4120, top = 2.7 * 1.48 * 1.06;
    const roles = [
      ['Engineering Manager', 2.7, 0.034], ['Senior Software Engineer', 1.82, 0.126], ['Product Manager', 1.65, 0.051],
      ['Software Engineer', 1, 0.301], ['HR Business Partner', 0.72, 0.036], ['Data Analyst', 0.68, 0.092],
      ['QA Engineer', 0.54, 0.148], ['Sales Executive', 0.5, 0.212]
    ];
    const pct = (x) => (x / top) * 100;
    const rows = roles.map((r, i) => {
      const [title, mult, share] = r;
      const people = Math.round(total * share);
      const out = Math.round(people * 0.012 * (1 + (i % 3) * 0.5));
      const on = i === 3;
      return {
        title, median: (base * mult / 100000).toFixed(1) + 'L', people: people.toLocaleString('en-US'),
        outText: out ? out + ' outliers' : 'no outliers',
        outStyle: out ? 'color: #6B3800; background: #FFE2B8; padding: 1px 8px; border-radius: 999px; font-weight: 500' : '',
        style: 'display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 18px; text-decoration: none; ' + (on ? 'background: #F0F8DF; box-shadow: inset 0 0 0 1.5px #2B2B2B' : 'background: transparent'),
        box: 'position: absolute; top: 0; height: 8px; border-radius: 999px; background: #D4F36B; left: ' + pct(mult * 0.86) + '%; width: ' + (pct(mult * 1.14) - pct(mult * 0.86)) + '%',
        tick: 'position: absolute; top: -3px; width: 2px; height: 14px; background: #2B2B2B; left: ' + pct(mult) + '%'
      };
    });
    return { rows };
  }
}
</script>
</body>
</html>
