<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filter dropdown open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B2B2B}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 520px; height: 580px; box-sizing: border-box; padding: 24px; background: #F6F8F5; font-family: 'Outfit', system-ui, sans-serif; color: #2B2B2B; font-size: 14.5px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-expanded="true" aria-controls="country-menu" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: #2B2B2B; color: #FFFFFF; font: inherit; display: flex; align-items: center; gap: 8px">Country <span style="min-width: 20px; padding: 1px 7px; border-radius: 999px; background: #D4F36B; color: #2B2B2B; font-size: 12.5px">2</span> <span aria-hidden="true">⌃</span></button>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: #FFFFFF; font: inherit; color: #2B2B2B">Job title ⌄</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: #FFFFFF; font: inherit; color: #2B2B2B">Department ⌄</button>
</div>

<div id="country-menu" role="dialog" aria-label="Filter by country" style="width: 320px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 18px 40px rgba(43,43,43,0.14); padding: 10px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 999px; background: #F6F8F5">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6F7571" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<label for="cm-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search countries</label>
<input id="cm-search" placeholder="Search countries" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: #2B2B2B">
</div>
<sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
<label style="{{ it.style }}">
<input type="checkbox" checked="{{ it.on }}" style="width: 18px; height: 18px; accent-color: #2B2B2B">
<span style="flex: 1">{{ it.name }}</span>
<span style="font-size: 12.5px; color: #6F7571; font-variant-numeric: tabular-nums">{{ it.n }}</span>
</label>
</sc-for>
<div style="display: flex; justify-content: space-between; gap: 8px; padding: 8px 4px 2px; border-top: 1px solid #F1F3F1; margin-top: 4px">
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; font: inherit; color: #2B2B2B">Clear</button>
<button type="button" style="min-height: 44px; padding: 0 22px; border-radius: 999px; border: 0; background: #D4F36B; font: inherit; font-weight: 500; color: #2B2B2B">Show 6,430 people</button>
</div>
</div>

<p style="margin: 6px 0 0; font-size: 12.5px; color: #6F7571; max-width: 440px">Multi-select. Counts are headcount per option under the other active filters. The pill shows the number selected; the apply button shows the resulting total.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":580}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [['India', '4,120', true], ['United States', '2,310', true], ['United Kingdom', '1,180', false], ['Germany', '960', false], ['Canada', '820', false], ['Singapore', '610', false]];
    const items = rows.map(([name, n, on]) => ({
      name, n, on,
      style: 'display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 14px; cursor: pointer; background: ' + (on ? '#F0F8DF' : 'transparent')
    }));
    return { items };
  }
}
</script>
</body>
</html>
