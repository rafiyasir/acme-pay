<div style="width: 720px; height: 520px; box-sizing: border-box; padding: 44px 64px; background: linear-gradient(150deg, #E3EEE7 0%, #CFE8DA 100%); font-family: 'Outfit', system-ui, sans-serif; color: #161A18; font-size: 14px">
<div role="dialog" aria-label="Command palette" style="border-radius: 28px; background: rgba(255,255,255,0.94); box-shadow: 0 24px 60px rgba(31,37,35,0.18); padding: 10px; display: flex; flex-direction: column; gap: 6px">

<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6662" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<label for="cmd" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search people and actions</label>
<input id="cmd" value="aar" style="flex: 1; min-height: 50px; border: 0; background: transparent; font: inherit; font-size: 17px; color: #161A18">
<span style="font-size: 12px; color: #5E6662; padding: 4px 10px; border-radius: 999px; background: #FFFFFF">esc</span>
</div>

<div role="listbox" aria-label="Results" style="display: flex; flex-direction: column; gap: 2px; padding: 4px">

<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #D4F36B; color: #2B2B2B; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">AM</span>
<span style="flex: 1"><strong style="font-weight: 600">Aar</strong>av Mehta <span style="color: #A7B0AB">· Software Engineer · India</span></span>
<span style="padding: 4px 10px; border-radius: 999px; background: #D4F36B; color: #24400A; font-size: 12px; font-weight: 600">+8%</span>
</div>
<div role="option" aria-selected="false" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-radius: 18px">
<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #9FE3C6; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">AS</span>
<span style="flex: 1"><strong style="font-weight: 600">Aar</strong>ti Sharma <span style="color: #5E6662">· Data Analyst · India</span></span>
<span style="padding: 4px 10px; border-radius: 999px; background: rgba(31,37,35,0.06); font-size: 12px; font-weight: 600; color: #3B423E">at median</span>
</div>
<p style="margin: 10px 12px 4px; font-size: 12px; color: #5E6662">Actions</p>
<div role="option" aria-selected="false" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 18px">
<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #F2F6F3; display: flex; align-items: center; justify-content: center; font-size: 18px">+</span>
<span style="flex: 1">New employee</span><span style="font-size: 12px; color: #5E6662">N</span>
</div>
<div role="option" aria-selected="false" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 18px">
<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #F2F6F3; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3B423E" stroke-width="2" stroke-linecap="round"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path></svg></span>
<span style="flex: 1">Go to Pay bands</span><span style="font-size: 12px; color: #5E6662">G then B</span>
</div>
</div>
</div>
</div>
